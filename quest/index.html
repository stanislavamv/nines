<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Nines</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column, a sticky status bar, and a map drawn as a traceroute: nine hops from Tier 1 to SRE II.
   Look: a city at night. The map is the full illustrated scene, lessons sit under a dusk grid sky,
   and the Code Lab and Drills are lantern-and-ink: cream paper cards with thick outlines. */
:root{
  color-scheme:dark;
  --ink:#141935; --panel:#1c2349; --panel2:#262e5e; --line:#39427a;
  --fg:#eef0ff; --mut:#a9b0d8;
  --syn:#f2c46d;   /* lantern: the accent, things in flight */
  --ack:#72d3ae;   /* done, correct */
  --rst:#f07084;   /* wrong, pages */
  --info:#a8b8ff;
  --pen:#0d1130;   /* the outline colour */
  --dusk:#e59ab3; --moon:#f4eedc; --noren:#c8394a; --paper:#f6e7c8;
  --display:"Dela Gothic One","Arial Black",Impact,system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--ink);color:var(--fg);font:16px/1.6 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:var(--info)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--syn);outline-offset:2px}
code,pre,.mono{font-family:var(--mono)}
code{font-size:.88em;background:var(--panel2);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* status bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ink);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:14px;align-items:center;padding-block:10px;flex-wrap:wrap}
.brand{font:800 1.05rem var(--display);letter-spacing:.01em;text-decoration:none;color:var(--fg)}
.brand b{color:var(--syn)}
.rank{font:500 .8rem var(--mono);color:var(--ack);border:1px solid var(--line);padding:3px 9px;border-radius:99px;white-space:nowrap}
.xp{flex:1 1 140px;min-width:120px;display:flex;align-items:center;gap:8px;font:500 .78rem var(--mono);color:var(--mut)}
.xp i{flex:1;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;display:block}
.xp i b{display:block;height:100%;background:var(--syn);width:0;transition:width .4s}
.navlink{font:500 .85rem var(--body);color:var(--mut);text-decoration:none;padding:4px 2px}
.navlink:hover,.navlink.on{color:var(--fg)}
.navlink.on{border-bottom:2px solid var(--syn)}
.pnote{margin:1.6em 0 0;border:1px solid var(--line);border-left:3px solid var(--info);border-radius:0 10px 10px 0;padding:10px 14px;background:var(--panel)}
.pnote.me{border-left-color:var(--ack)}
.pnote .k{font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--info)}
.pnote.me .k{color:var(--ack)}
.pnote p{margin:.4em 0}
.cover td:first-child{color:var(--mut);font-family:var(--mono)}
.cover td:nth-child(2){white-space:normal;min-width:220px;font-weight:500}
.cover td:nth-child(3){min-width:280px}
.cov{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:.82rem;color:var(--mut)}
.cov+.ans{margin-top:8px}
input[type=file]{font:inherit;font-size:.88rem;color:var(--mut);max-width:100%}

main{padding-block:28px 80px}
.kicker{font:500 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--syn)}
.lede{color:var(--mut);max-width:62ch}

/* map */
.hero{display:grid;gap:14px;margin-bottom:26px}
.hero h1{font-size:clamp(2.1rem,6vw,3.6rem);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--syn)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.trace{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trace-h{font:500 .82rem var(--mono);color:var(--mut);padding:12px 16px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.trace-h b{color:var(--fg);font-weight:500}
.hop{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.hop:last-child{border-bottom:0}
.hop:hover{background:var(--panel2)}
.hop .n{font:500 .9rem var(--mono);color:var(--mut)}
.hop .t{font:700 1.08rem var(--display)}
.hop .s{display:block;font-size:.85rem;color:var(--mut)}
.hop .st{font:500 .76rem var(--mono);text-align:right;color:var(--mut);white-space:nowrap}
.hop.done .n,.hop.done .st{color:var(--ack)}
.hop.part .st{color:var(--syn)}
.net{position:relative;height:440px;margin-bottom:22px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#16233a 0%,#0a101b 70%);touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.net.drag{cursor:grabbing}
.net.over{cursor:pointer}
.net canvas{display:block;width:100%;height:100%}
.lbl{position:absolute;left:0;top:0;pointer-events:none;font:500 .74rem var(--mono);color:var(--fg);white-space:nowrap;will-change:transform;text-shadow:0 1px 4px #000}
.lbl b{color:var(--syn);font-weight:600;margin-right:5px}
.lbl.done b{color:var(--ack)}
.lbl.sel{color:var(--syn)}
.nethint{position:absolute;right:12px;top:10px;font:500 .72rem var(--mono);color:var(--mut);pointer-events:none}
.netinfo{position:absolute;left:12px;bottom:12px;max-width:min(340px,calc(100% - 24px));background:rgba(12,19,31,.88);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;cursor:default}
.netinfo .k{font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--syn)}
.netinfo h3{font-size:1.15rem}
.netinfo p{margin:0;font-size:.85rem;color:var(--mut)}
@media (max-width:600px){.net{height:380px}.nethint{display:none}}
.side{display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{font-size:1.02rem;margin-bottom:6px}
.card p{margin:.4em 0;color:var(--mut);font-size:.92rem}
.pager{border-color:var(--rst)}
.pager .alert{font:500 .82rem var(--mono);color:var(--rst);min-height:2.6em;margin:.5em 0}
.btn{background:var(--syn);color:#1b1404;border:0;border-radius:7px;padding:9px 14px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel2);filter:none}
.btn.sm{padding:5px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* level */
.lvh{display:grid;gap:8px;margin-bottom:18px}
.lvh h1{font-size:clamp(1.8rem,5vw,2.7rem);font-weight:800;letter-spacing:-.015em}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--mut);font-weight:500}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--syn)}
.tab .c{font:500 .72rem var(--mono);color:var(--ack);margin-left:5px}

.lesson{max-width:70ch}
.lesson h3{font-size:1.25rem;margin:1.7em 0 .5em}
.lesson h3:first-child{margin-top:0}
.lesson p,.lesson li{margin:.55em 0}
.lesson ul,.lesson ol{padding-left:1.2em}
.rules li{padding-left:.2em}
q{quotes:"\201C" "\201D"}
.say{border-left:3px solid var(--syn);background:var(--panel);padding:10px 14px;border-radius:0 8px 8px 0;font-style:italic}
.say::before{content:"Say it  ";font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--syn);font-style:normal;display:block}
.note{color:var(--syn);font-size:.92em}
.scroll{overflow-x:auto;margin:.8em 0}
.t{border-collapse:collapse;width:100%;font-size:.92rem}
.t th{font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left}
.t th,.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t td:first-child{white-space:nowrap}
.t td{font-variant-numeric:tabular-nums}
.code{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-size:.82rem;line-height:1.7}
.dg{margin:1em 0;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.dg svg{display:block;min-width:560px;width:100%;height:auto;font-family:var(--mono)}
.d-box{fill:var(--panel2);stroke:var(--line)} .d-hi{fill:var(--panel2);stroke:var(--syn)} .d-ok{fill:var(--panel2);stroke:var(--ack)} .d-bad{fill:var(--panel2);stroke:var(--rst)}
.d-t{fill:var(--fg);font-size:12px} .d-m{fill:var(--mut);font-size:11px} .d-s{fill:var(--syn);font-size:11px} .d-a{fill:var(--ack);font-size:11px} .d-r{fill:var(--rst);font-size:11px}
.d-l{stroke:var(--mut);stroke-width:1.4;fill:none} .d-ls{stroke:var(--syn);stroke-width:1.6;fill:none} .d-la{stroke:var(--ack);stroke-width:1.6;fill:none} .d-lr{stroke:var(--rst);stroke-width:1.6;fill:none;stroke-dasharray:4 3}
.dgi{margin:1.1em 0;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}
.dgi .dg{border:0;padding:0;margin:.5em 0;background:transparent}
.dgi svg text{pointer-events:none}
.dgh{margin:0 0 8px;font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--syn)}
.dgc{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.85rem;color:var(--mut)}
.chip:hover{color:var(--fg);border-color:var(--mut)}
.chip[aria-pressed="true"]{background:var(--syn);border-color:var(--syn);color:#1b1404;font-weight:600}
.dgo{margin:8px 0 0;font-size:.92rem;color:var(--mut);min-height:3.2em}
.dgo b{color:var(--fg)}
.dgl{display:block;margin:10px 0 4px;font-size:.88rem;color:var(--mut)}
.dgl b{color:var(--syn)}
.dgi input[type=range]{width:100%;accent-color:var(--syn)}
.dgi input[type=checkbox]{accent-color:var(--syn)}
.mtu{margin:12px 0 4px}
.mtubar{display:flex;height:44px;border-radius:7px;overflow:hidden;background:var(--panel2);font:500 .78rem var(--mono)}
.mtubar i{flex:0 0 0%;background:var(--line);color:var(--fg);font-style:normal;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;transition:flex-basis .35s}
.mtubar b{flex:1;min-width:0;background:var(--syn);color:#1b1404;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
#bl{background:var(--panel2);color:var(--ack)}
.d-on{stroke:var(--syn)!important;stroke-width:2.4;fill:rgba(242,184,75,.2)!important}
[data-b]:focus-visible{outline:2px solid var(--syn)}
.ed{min-height:300px;font:400 .86rem/1.6 var(--mono);background:#070b12;white-space:pre;overflow:auto;tab-size:4;resize:vertical}
.fx{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel)}
.fx summary{cursor:pointer;font:500 .8rem var(--mono);color:var(--mut)}
.fx .code{border:0;padding:8px 0 2px;background:transparent;max-height:240px}
.tres{border:1px solid var(--line);border-left:3px solid var(--rst);border-radius:0 10px 10px 0;padding:10px 14px;background:var(--panel)}
.tres.good{border-left-color:var(--ack)}
.tres p{margin:.3em 0 0;color:var(--mut);font-size:.92rem}
.tres .steps li.x{color:var(--rst)}.tres .steps li.x::before{content:"\2715";color:var(--rst)}
.tout{margin-top:10px}.tout .k{font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.tout .code{margin:4px 0 0;max-height:260px}.tout .code.err{color:var(--rst)}
.d-f1{fill:var(--line)} .d-f2{fill:var(--syn)} .d-f3{fill:var(--ack)} .d-f4{fill:var(--info)}

/* quiz */
.qz{display:grid;gap:16px;max-width:760px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.q h4{font:600 1rem var(--body);margin:0 0 10px}
.q .num{font:500 .75rem var(--mono);color:var(--mut)}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--syn)}
.opt.ok{border-color:var(--ack);color:var(--ack)}
.opt.no{border-color:var(--rst);color:var(--rst)}
.opt:disabled{cursor:default}
.exp{margin-top:10px;font-size:.92rem;color:var(--mut);border-top:1px dashed var(--line);padding-top:10px}
.score{font:500 .9rem var(--mono);color:var(--mut)}
.score b{color:var(--ack)}

/* terminal */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.m{display:grid;gap:6px;align-content:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.m:hover{border-color:var(--syn)}
.m b{font:700 1.02rem var(--display)}
.m span{font-size:.86rem;color:var(--mut)}
.m .tag{font:500 .72rem var(--mono);color:var(--mut)}
.m.done .tag{color:var(--ack)}
.lab{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.lab{grid-template-columns:minmax(0,1fr)}}
.brief{display:grid;gap:10px}
.brief h3{font-size:1.2rem}
.brief p{margin:0;color:var(--mut);font-size:.93rem}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{display:grid;grid-template-columns:1.3rem minmax(0,1fr);gap:6px;font-size:.9rem;color:var(--mut)}
.steps li::before{content:"\25CB";color:var(--mut)}
.steps li.d{color:var(--fg)}
.steps li.d::before{content:"\25CF";color:var(--ack)}
.steps li.x{color:var(--rst)}.steps li.x::before{content:"\2715";color:var(--rst)}
.term{background:#070b12;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.term-h{display:flex;justify-content:space-between;gap:8px;font:500 .75rem var(--mono);color:var(--mut);padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.scr{height:min(56vh,460px);overflow:auto;padding:12px;font:400 .82rem/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.scr .p{color:var(--ack)} .scr .c{color:var(--fg)} .scr .o{color:#b9c6da} .scr .sys{color:var(--syn)} .scr .win{color:var(--ack)}
.inl{display:flex;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font:400 .82rem var(--mono)}
.inl label{color:var(--ack);white-space:nowrap}
.inl input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;outline:none;caret-color:var(--syn)}

/* speak */
.deck{max-width:720px;display:grid;gap:14px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px}
.sc h3{font-size:1.45rem}
.timer{font:600 2.2rem var(--mono);font-variant-numeric:tabular-nums;color:var(--syn)}
.timer.over{color:var(--rst)}
.ans b{display:block;font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--syn);margin-bottom:3px}
.ans p{margin:0 0 12px}
.ans .add{color:var(--mut)}
.grade{display:flex;gap:8px;flex-wrap:wrap}
.g-ok{border-color:var(--ack)!important;color:var(--ack)!important}
.g-no{border-color:var(--rst)!important;color:var(--rst)!important}
.story{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;max-width:74ch}
.story h3{font-size:1.15rem}
.story .use{font:500 .78rem var(--mono);color:var(--syn);margin:4px 0 8px}
.story p{margin:.5em 0}
.story .les{color:var(--ack)}
textarea{width:100%;min-height:74px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;font-size:.93rem}
.gap{display:grid;gap:6px;margin-bottom:14px;max-width:74ch}
.gap label{font-weight:600}
.gap small{color:var(--mut)}
.asks{display:grid;gap:8px;max-width:74ch;margin:0;padding:0;list-style:none}
.asks label{display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:8px;align-items:start}
.asks input{margin-top:.35em;accent-color:var(--syn)}
.sheet td:first-child{font-weight:600;color:var(--syn);white-space:normal}
.fld{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px 9px;font:inherit;font-size:.93rem}
.ivst{margin:.4em 0 .8em;padding-left:1.3em;color:var(--mut);font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ack);color:#04201a;font-weight:600;padding:10px 16px;border-radius:99px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Night city theme ===== */
h1,h2,h3{font-weight:400!important;letter-spacing:.005em!important}
.hop .t,.m b{font-weight:400}
.brand b{color:var(--syn);font-weight:400}
.bar{background:var(--pen);border-bottom:3px solid #000}
.bar nav{align-self:flex-start;margin-top:-10px}
.navlink{background-color:#2e3770;color:var(--mut);padding:7px 12px 9px;border:2px solid #000;border-top:0;border-radius:0 0 6px 6px;font-weight:600;
  background-image:linear-gradient(90deg,transparent 48%,#0003 48% 52%,transparent 52%)}
.navlink:hover{color:var(--fg)}
.navlink.on{background-color:var(--noren);color:#fff;border-bottom:2px solid #000}
.code,.ed{background:#0b0f26}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}

/* Map: the full scene */
.city{position:relative;border:3px solid var(--pen);border-radius:14px;overflow:hidden;margin-bottom:24px;box-shadow:0 24px 50px -24px #000c}
.city svg{display:block;width:100%;height:auto}
.city .ttl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.city .ttl b{display:block;font:400 clamp(2rem,8vw,5rem)/1 var(--display);color:var(--moon);text-shadow:3px 3px 0 var(--pen),-1px -1px 0 var(--pen)}
.city .ttl span{font:600 clamp(.6rem,1.5vw,.85rem) var(--mono);letter-spacing:.2em;color:var(--fg);text-shadow:2px 2px 0 var(--pen)}
body[data-zone="map"] .trace,body[data-zone="map"] .card,body[data-zone="map"] .net{border:3px solid var(--pen)}
body[data-zone="map"] .net{background:linear-gradient(#ffffff10 1.5px,transparent 1.5px) 0 0/48px 48px,linear-gradient(90deg,#ffffff10 1.5px,transparent 1.5px) 0 0/48px 48px,linear-gradient(180deg,#232b5c,#4a4a92 70%,#8a6aa8)}
body[data-zone="map"] .hop{border-bottom:2px solid var(--pen)}
body[data-zone="map"] .hop .n{background:#3a4580;color:var(--mut);border:2px solid var(--pen);border-radius:6px;text-align:center;font:400 .95rem/1.9 var(--display)}
body[data-zone="map"] .hop.part,body[data-zone="map"] .hop.part:hover{background:linear-gradient(180deg,#f8d98f,#f2c46d);--fg:#1b2142;--mut:#6b4a24;--syn:#8a2b1f;color:#1b2142}
body[data-zone="map"] .hop.part .n,body[data-zone="map"] .hop.done .n{background:var(--noren);color:#fff}
body[data-zone="map"] .hop.done{background:#2a3266}
body[data-zone="map"] .pager{border-color:var(--noren)}

/* Lessons and stories: dusk grid sky, content on a cloud panel */
body[data-zone="lesson"]{background:
  linear-gradient(#ffffff12 1.5px,transparent 1.5px) 0 0/56px 56px,
  linear-gradient(90deg,#ffffff12 1.5px,transparent 1.5px) 0 0/56px 56px,
  linear-gradient(180deg,#232b5c 0%,#4b4a93 55%,#9a6fae 85%,#e59ab3 100%) fixed;background-attachment:fixed}
body[data-zone="lesson"]::after{content:"";position:fixed;right:5vw;top:96px;width:64px;height:64px;border-radius:50%;box-shadow:-13px 9px 0 0 var(--moon);filter:drop-shadow(0 0 14px #e59ab3aa);pointer-events:none;z-index:0}
body[data-zone="lesson"] main{position:relative;z-index:1;margin-top:40px;margin-bottom:40px;padding-block:28px 40px;background:#1a2150f2;border:3px solid var(--pen);border-radius:22px;box-shadow:0 -6px 0 0 var(--dusk),0 -9px 0 0 var(--pen),0 30px 60px -30px #000c}
body[data-zone="lesson"] :is(.q,.dgi,.dg,.sc,.story,.card,.m,.term){border:2px solid var(--pen)}
body[data-zone="lesson"] .say{border-left-color:var(--dusk)}
body[data-zone="lesson"] .say::before{color:var(--dusk)}
@media (max-width:700px){body[data-zone="lesson"]::after{display:none}body[data-zone="lesson"] main{margin-top:18px;border-radius:16px}}

/* Code Lab and Drills: lantern and ink */
body[data-zone="ink"] :is(.m,.card,.sc,.brief,.tres,.cov){
  --fg:#1b2142;--mut:#5d5677;--panel:#f6e7c8;--panel2:#efdcb5;--line:#c9a96b;--syn:#a8392b;--ack:#23704f;--rst:#b8283d;--info:#2c4aa8;
  background:var(--paper);color:var(--fg);border:3px solid var(--pen);box-shadow:5px 5px 0 var(--pen)}
body[data-zone="ink"] .brief{padding:18px;border-radius:12px}
body[data-zone="ink"] .brief .fx{border:2px dashed var(--line);background:#efdcb5}
body[data-zone="ink"] .tres{border-radius:10px}
body[data-zone="ink"] .tres.good{border-left:10px solid #23704f}
body[data-zone="ink"] .tres.bad{border-left:10px solid var(--noren)}
body[data-zone="ink"] .m{border-radius:10px}
body[data-zone="ink"] .m:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--pen)}
body[data-zone="ink"] .m.done{background:linear-gradient(180deg,#f8d98f,#f2c46d)}
body[data-zone="ink"] .cov{box-shadow:2px 2px 0 var(--pen);border-width:2px}
body[data-zone="ink"] label[for="led"]{display:block;margin:0;padding:8px 14px 10px;background:var(--noren);color:#fff;font:400 1rem var(--display);letter-spacing:.06em;border:3px solid var(--pen);border-bottom:0;border-radius:12px 12px 0 0;
  background-image:linear-gradient(90deg,transparent 24%,#0004 24% 25%,transparent 25% 49%,#0004 49% 50%,transparent 50% 74%,#0004 74% 75%,transparent 75%)}
body[data-zone="ink"] .ed{border:3px solid var(--pen);border-radius:0 0 12px 12px;box-shadow:inset 0 0 0 2px #f2c46d22,0 0 40px -12px #f2c46d66}
body[data-zone="ink"] .btn{border:3px solid var(--pen);border-radius:999px;box-shadow:3px 3px 0 var(--pen);font:400 .95rem var(--display);padding:8px 16px;color:#1b2142}
body[data-zone="ink"] .btn.sm{font-size:.82rem;padding:5px 12px}
body[data-zone="ink"] .btn:not(.ghost){background:#f2c46d}
body[data-zone="ink"] .btn.ghost{background:var(--paper)}
body[data-zone="ink"] .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pen)}
body[data-zone="ink"] .chip{border:2px solid var(--pen);background:#2a3266;color:var(--fg)}
body[data-zone="ink"] .chip[aria-pressed="true"]{background:var(--syn);color:#1b2142}
body[data-zone="ink"] .tab[aria-selected="true"]{background:var(--paper);color:#1b2142;border:3px solid var(--pen);border-bottom:0;border-radius:10px 10px 0 0}
body[data-zone="ink"] .tabs{border-bottom:3px solid var(--pen)}
body[data-zone="ink"] .tab .c{color:#23704f}

/* Remember */
.rm-top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.rm-top{grid-template-columns:minmax(0,1fr)}}
.rm-go h3{font-size:1.35rem}
.lboxes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.lbox svg{width:26px;height:32px;display:block;margin:0 auto}
.lbox b{display:block;font:400 1rem var(--display)}
.lbox small{display:block;font:500 .62rem var(--mono);color:var(--mut);line-height:1.2}
.rm-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;max-width:720px}
.rm-bar i{flex:1;height:12px;border:3px solid var(--pen);border-radius:99px;background:#2a3266;overflow:hidden;display:block}
.rm-bar i b{display:block;height:100%;background:var(--syn);transition:width .3s}
.rm-card{min-height:340px;align-content:start}
.rm-term{font-size:clamp(1.6rem,5vw,2.2rem)}
.rm-mean{font-size:1.15rem;margin:0}
.rm-sent{font-size:1.05rem;margin:0;line-height:1.7}
.rm-blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--syn);text-align:center;font-weight:600}
.rm-blank.filled{color:var(--ack)}
.rm-opts{display:grid;grid-template-columns:1fr;gap:10px}
.rm-opts.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.rm-opts.chunks{display:flex;flex-wrap:wrap}
.rm-opts.letters{display:flex;flex-wrap:wrap;gap:8px}
.rm-opts.letters .tile{width:46px;height:46px;padding:0;text-align:center;font:400 1.15rem var(--display)}
.tile{text-align:left;background:#fffaf0;color:var(--pen);border:3px solid var(--pen);border-radius:12px;padding:11px 14px;box-shadow:3px 3px 0 var(--pen);font:500 1rem/1.35 var(--body);transition:transform .08s}
.tile:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--pen)}
.tile:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pen)}
.tile:disabled{opacity:.45;cursor:default}
.tile.ok{background:#bfe8d3;opacity:1}
.tile.no{background:#f6c0c6;opacity:1;animation:shake .3s}
.tile.sel{background:#f2c46d}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.rm-match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px}
.rm-match>div{display:grid;gap:10px;align-content:start}
.rm-built{min-height:3.2em;border:2px dashed var(--line);border-radius:10px;padding:10px;font-size:1.02rem;line-height:1.7}
.rm-built .chunk{background:#fffaf0;border:2px solid var(--pen);border-radius:8px;padding:2px 7px;margin:2px 0;display:inline-block}
.rm-ph{color:var(--mut)}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:38px;height:44px;border-bottom:4px solid var(--pen);display:grid;place-items:center;font:400 1.3rem var(--display)}
.slot.full{color:var(--ack)}
.sp{width:16px}
.rm-fb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:3px solid var(--pen);border-radius:12px;padding:10px 14px}
.rm-fb.ok{background:#bfe8d3}
.rm-fb.no{background:#f6d2d6}
@media (prefers-reduced-motion:reduce){.tile.no{animation:none}}
/* Account chip */
.acct{font:500 .74rem var(--mono);text-decoration:none;color:var(--mut);border:1px solid var(--line);padding:3px 9px;border-radius:99px;white-space:nowrap}
.acct::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#6f78ad;margin-right:6px;vertical-align:1px}
.acct.synced{color:var(--ack)}.acct.synced::before{background:var(--ack)}
.acct.syncing::before,.acct.error::before{background:var(--syn)}
/* Certs */
a.cert-card{text-decoration:none;color:inherit}
.cert-card.soon{opacity:.6}
.cert-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:6px}
.cert-facts div{background:var(--paper);color:var(--pen);border:3px solid var(--pen);border-radius:10px;padding:10px 12px;box-shadow:4px 4px 0 var(--pen);display:grid;gap:2px}
.cert-facts .kicker{color:#a8392b}
.cert-notes{margin-top:10px}
.cert-notes .lesson{max-width:none;padding:6px 4px 4px}
.cert-notes .lesson ul{margin:.3em 0}
.exgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.exgrid button{width:36px;height:32px;border:2px solid var(--pen);border-radius:6px;background:#2a3266;color:var(--fg);font:500 .78rem var(--mono)}
.exgrid button.done{background:#4b5596}
.exgrid button.flg{box-shadow:inset 0 -4px 0 #f2c46d}
.exgrid button.cur{background:#f2c46d;color:var(--pen)}
.pq-rows{display:grid;gap:10px}
.pq-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 8.5em;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:8px}
.pq-row label{font-weight:500}
.pq-row .fld{background:#fffaf0;color:var(--pen);border:2px solid var(--pen)}
.pq-mark{min-width:1.5em;font-size:.88rem}
.pq-mark .good,.pq-key .good{color:#23704f;font-weight:700}
.pq-mark .bad,.pq-key .bad{color:#b8283d;font-weight:600}
.pq-key{margin:10px 0 0;padding-left:1.4em}
@media (max-width:640px){.pq-row{grid-template-columns:minmax(0,1fr)}}

/* ---------- subnet drill ---------- */
function ip2s(n){return [n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join(".");}
function subnet(p){
  var streak=0,cur;
  function gen(){var pre=[23,24,25,26,26,27,27,28,28,29,30][Math.floor(Math.random()*11)],base=[[10,0],[10,1],[172,16],[192,168]][Math.floor(Math.random()*4)];
    var ip=((base[0]<<24)>>>0)+(base[1]<<16)+(Math.floor(Math.random()*6)<<8)+1+Math.floor(Math.random()*253),size=Math.pow(2,32-pre),net=Math.floor(ip/size)*size;
    if(ip===net||ip===net+size-1)ip=net+1;cur={ip:ip,pre:pre,net:net,bc:net+size-1,hosts:size-2};}
  function draw(msg){gen();p.innerHTML='<div class="deck"><div class="sc"><span class="kicker">Streak '+streak+' / 5'+(S.mis.subnet?" · cleared":"")+'</span><h3 class="mono">'+ip2s(cur.ip)+'/'+cur.pre+'</h3>'+
    '<form id="sf" class="row"><input id="s-net" class="mono" placeholder="network address" aria-label="Network address" style="flex:1 1 160px"><input id="s-bc" class="mono" placeholder="broadcast" aria-label="Broadcast address" style="flex:1 1 160px"><input id="s-h" class="mono" placeholder="usable hosts" aria-label="Usable hosts" inputmode="numeric" style="flex:1 1 110px"><button class="btn">Check</button></form>'+
    '<p id="sm" style="margin:0;color:var(--mut)">'+(msg||"Block size = 256 minus the last mask octet that isn't 255. Five in a row clears the drill.")+'</p></div></div>';
    [].forEach.call(p.querySelectorAll("input"),function(i){i.style.cssText+=";background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px;color:var(--fg);min-width:0";});
    $("#sf").onsubmit=function(e){e.preventDefault();var ok=$("#s-net").value.trim()===ip2s(cur.net)&&$("#s-bc").value.trim()===ip2s(cur.bc)&&+$("#s-h").value===cur.hosts;
      var sol=ip2s(cur.ip)+"/"+cur.pre+": network "+ip2s(cur.net)+", broadcast "+ip2s(cur.bc)+", "+cur.hosts+" usable.";
      if(ok){streak++;if(streak>=5&&!S.mis.subnet){S.mis.subnet=1;save();toast("Subnet drill cleared: +60 XP");}draw("Correct. "+sol);}else{streak=0;draw("Not quite. "+sol+" Streak reset.");}
      $("#s-net").focus();};}
  draw();
}

    runMission(p,m,function(){clearTimers();certMocks(p,C);},function(_,r){if(!r)return;st.mock[m.id]=Math.max(st.mock[m.id]||0,r.p);save();toast(r.p>=70?"Passed: "+r.p+"%":"Scored "+r.p+"%");});};}
function certPbqList(p,C){var st=certSt(C.id);st.pbq=st.pbq||{};
  p.innerHTML='<div class="lesson" style="margin-bottom:14px"><p>'+(C.pbqIntro||'Performance-based questions come first on the real exam and carry more weight. They ask you to do something: match, order, configure. Each item scores on its own, so partial answers still earn points. Flag them on exam day, finish the multiple choice, then come back.')+'</p></div>'+
   '<div class="mlist">'+C.pbqs.map(function(q,i){var b=st.pbq[q.id];return '<button class="m'+(b===1?" done":"")+'" data-pq="'+i+'"><span class="tag">'+(b!=null?(b===1?"✓ perfect":"best "+Math.round(b*100)+"%"):(q.type==="order"?"order":"match and configure"))+' · '+esc(C.domains[q.d].name)+'</span><b>'+esc(q.title)+'</b></button>';}).join("")+'</div>';
  p.querySelector(".mlist").onclick=function(e){var b=e.target.closest("[data-pq]");if(b)certPbq(p,C,C.pbqs[+b.getAttribute("data-pq")]);};}
function certPbq(p,C,q){var st=certSt(C.id),t0=Date.now();st.pbq=st.pbq||{};
  function ok(row,v){var a=row.a!=null?row.a:row[1];if(row.re)return new RegExp(row.re,"i").test(String(v).trim());return [].concat(a).indexOf(v)>=0;}
  var head='<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn ghost sm" id="pqback">← All PBQs</button><span class="timer" id="pqt" style="font-size:1.2rem">0:00</span></div><div class="sc"><span class="kicker">PBQ · '+esc(C.domains[q.d].name)+'</span><h3>'+esc(q.title)+'</h3><p style="margin:0">'+q.intro+'</p>';
  timers.push(setInterval(function(){var s=Math.floor((Date.now()-t0)/1000),e=$("#pqt");if(e)e.textContent=Math.floor(s/60)+":"+("0"+s%60).slice(-2);},1000));
  function back(){clearTimers();certPbqList(p,C);}
  function finish(score,total,detail){clearTimers();var f=score/total;st.pbq[q.id]=Math.max(st.pbq[q.id]||0,f);save();
    var r=$("#pqres");r.innerHTML='<div class="rm-fb '+(score===total?"ok":"no")+'"><span><b>'+score+' of '+total+' correct.</b> '+(q.explain?esc(q.explain):"")+'</span><button class="btn" id="pqagain">Try again</button></div>'+(detail||"");
    $("#pqagain").onclick=function(){certPbq(p,C,q);};$("#pqsub").disabled=true;}
  if(q.type==="order"){var mix=shuffle(q.items.map(function(_,i){return i;})),got=[];
    function draw(){p.innerHTML=head+'<div class="rm-built">'+(got.length?got.map(function(i,n){return '<span class="chunk">'+(n+1)+'. '+esc(q.items[i])+'</span>';}).join("<br>"):'<span class="rm-ph">Tap the steps in order</span>')+'</div>'+
      '<div class="rm-opts">'+mix.map(function(i){return '<button class="tile" data-i="'+i+'"'+(got.indexOf(i)>=0?" disabled":"")+'>'+esc(q.items[i])+'</button>';}).join("")+'</div><div class="row"><button class="btn ghost sm" id="pqun"'+(got.length?"":" disabled")+'>Undo</button><button class="btn" id="pqsub"'+(got.length===q.items.length?"":" disabled")+'>Submit</button></div><div id="pqres"></div></div>';
      $("#pqback").onclick=back;
      p.querySelector(".rm-opts").onclick=function(e){var b=e.target.closest(".tile");if(!b||b.disabled)return;got.push(+b.getAttribute("data-i"));draw();};
      $("#pqun").onclick=function(){got.pop();draw();};
      $("#pqsub").onclick=function(){var sc=got.filter(function(v,i){return v===i;}).length;[].forEach.call(p.querySelectorAll(".tile,#pqun"),function(x){x.disabled=true;});
        finish(sc,q.items.length,sc===q.items.length?"":'<ol class="pq-key">'+q.items.map(function(s,i){return '<li class="'+(got[i]===i?"good":"bad")+'">'+esc(s)+'</li>';}).join("")+'</ol>');};}
    draw();return;}
  var rows=q.rows.map(function(r){return Array.isArray(r)?{l:r[0],a:r[1],o:r[2]}:r;});
  p.innerHTML=head+'<div class="pq-rows">'+rows.map(function(r,i){var opts=r.o||q.opts,id="pq"+i;
      return '<div class="pq-row"><label for="'+id+'">'+esc(r.l)+'</label>'+(r.re?'<input class="fld" id="'+id+'" autocomplete="off" spellcheck="false" placeholder="'+esc(r.ph||"")+'">':'<select class="fld" id="'+id+'"><option value="">Choose…</option>'+(q.keep?opts:shuffle(opts)).map(function(o){return '<option>'+esc(o)+'</option>';}).join("")+'</select>')+'<span class="pq-mark" id="pqm'+i+'"></span></div>';}).join("")+
    '</div><div class="row"><button class="btn" id="pqsub">Submit</button></div><div id="pqres"></div></div>';
  $("#pqback").onclick=back;
  $("#pqsub").onclick=function(){var sc=0;rows.forEach(function(r,i){var el=$("#pq"+i),good=ok(r,el.value);if(good)sc++;el.disabled=true;
      $("#pqm"+i).innerHTML=good?'<span class="good">✓</span>':'<span class="bad">✕ '+esc(r.show||[].concat(r.a)[0])+'</span>';});finish(sc,rows.length);};}
function certPractice(p,C,chips){var st=certSt(C.id);
  p.innerHTML='<div class="dgc" id="cdc">'+chips.map(function(c){return '<button class="chip" data-t="'+c[0]+'" aria-pressed="'+(c[0]===CV.dom)+'">'+esc(c[1])+'</button>';}).join("")+'</div>'+
   '<div class="row" style="margin:14px 0 18px"><button class="btn" id="cgo">10 questions</button><button class="btn ghost" id="cmiss">Only ones I missed</button></div><div id="cq"></div>';
  $("#cdc").onclick=function(e){var b=e.target.closest(".chip");if(b){CV.dom=b.getAttribute("data-t");certPractice(p,C,chips);}};
  function pool(missed){return certQs(C).filter(function(q){return (CV.dom==="all"||CV.dom==="L"+(q.d+1))&&(!missed||st.q[q.k]===0);});}
  function run(list){var qs=shuffle(list).slice(0,10),i=0,ok=0,box=$("#cq");if(!qs.length){box.innerHTML='<p class="lede">Nothing here yet. Missed questions show up after you practise.</p>';return;}
    (function one(){if(i>=qs.length){box.innerHTML='<div class="sc"><h3>'+ok+' of '+qs.length+' right</h3><p style="margin:0;color:var(--mut)">Missed ones are saved under “Only ones I missed”. Aim for 85 percent or better before the real exam.</p><div class="row"><button class="btn" id="cagain">Another 10</button></div></div>';$("#cagain").onclick=function(){run(pool(false));};hud();return;}
      var q=qs[i],opts=shuffle([q.a].concat(q.w));
      box.innerHTML='<div class="sc"><span class="kicker">Question '+(i+1)+' of '+qs.length+' · '+esc(C.domains[q.d].name)+'</span><h3 style="font-size:1.15rem">'+esc(q.q)+'</h3><div class="rm-opts">'+opts.map(function(o,j){return '<button class="tile" data-i="'+j+'">'+esc(o)+'</button>';}).join("")+'</div><div id="cfb"></div></div>';
      box.querySelector(".rm-opts").onclick=function(e){var b=e.target.closest(".tile");if(!b||box.dataset.lock==="1")return;box.dataset.lock="1";var good=opts[+b.getAttribute("data-i")]===q.a;
        [].forEach.call(box.querySelectorAll(".tile"),function(x){x.disabled=true;if(opts[+x.getAttribute("data-i")]===q.a)x.classList.add("ok");});if(!good)b.classList.add("no");
        st.q[q.k]=good?1:0;if(good)ok++;save();
        $("#cfb").innerHTML='<div class="rm-fb '+(good?"ok":"no")+'"><span><b>'+(good?"Right.":"Not quite.")+'</b> '+esc(q.e)+'</span><button class="btn" id="cnext">Next</button></div>';
        $("#cnext").onclick=function(){box.dataset.lock="0";i++;one();};$("#cnext").focus();};})();}
  $("#cgo").onclick=function(){run(pool(false));};$("#cmiss").onclick=function(){run(pool(true));};}
/* Practice exam: a few PBQs first, like the real test, then multiple choice weighted by domain.
   A PBQ counts as PBQW points, scored by the share of its items you got right. */
var PBQW=3;
function pbqRows(q){return q.rows.map(function(r){return Array.isArray(r)?{l:r[0],a:r[1],o:r[2]}:r;});}
function pbqOk(r,v){if(v==null||v==="")return false;if(r.re)return new RegExp(r.re,"i").test(String(v).trim());return [].concat(r.a).indexOf(v)>=0;}
function pbqFrac(q,a){if(!a)return 0;if(q.type==="order"){var n=0;q.items.forEach(function(_,i){if(a[i]===i)n++;});return n/q.items.length;}
  var rows=pbqRows(q),n=0;rows.forEach(function(r,i){if(pbqOk(r,a[i]))n++;});return n/rows.length;}
function certExam(p,C){var st=certSt(C.id),all=certQs(C),hist=st.ex.slice(-5).reverse(),pb=C.pbqs||[];
  var np=Math.min(C.examPbqs||3,pb.length),n=Math.max(0,Math.min((C.examSize||90)-np,all.length)),total=n+np,mins=C.examMinutes||total;
  p.innerHTML='<div class="sc"><h3>Timed practice exam</h3><p style="margin:0">'+(np&&n?np+' performance-based questions first, then ':np?np+' performance-based tasks. ':'')+(n?n+' multiple-choice questions drawn by domain weight. ':'')+mins+' minutes, no feedback until you finish. Flag questions and come back to them, like the real thing.</p>'+
   (np?'<p style="margin:0">Exam-day habit: skim the PBQs, flag them, answer the multiple choice, then come back with the time that is left. Here each PBQ is worth '+PBQW+' questions, with partial credit.</p>':'')+
   '<p style="margin:0;color:var(--mut)">The real exam is scaled from 100 to 900. Treat 85 percent here as ready.</p><div class="row"><button class="btn" id="exgo">Start the exam</button></div>'+
   (hist.length?'<p style="margin:0;color:var(--mut)">Recent: '+hist.map(function(h){return h.s+"% ("+h.d+")";}).join(" · ")+'</p>':'')+'</div>';
  $("#exgo").onclick=function(){
    var picks=[],byD=C.domains.map(function(d,di){return shuffle(all.filter(function(q){return q.d===di;}));});
    C.domains.forEach(function(d,di){var want=Math.round(n*d.weight/100);picks=picks.concat(byD[di].splice(0,want));});
    var rest=shuffle([].concat.apply([],byD));while(picks.length<n&&rest.length)picks.push(rest.pop());picks=shuffle(picks.slice(0,n));
    var items=shuffle(pb.slice()).slice(0,np).map(function(q){return {pbq:q};}).concat(picks.map(function(q){return {mc:q,o:shuffle([q.a].concat(q.w))};}));
    items.forEach(function(it){if(it.pbq&&it.pbq.type!=="order")it.ro=pbqRows(it.pbq).map(function(r){return r.re?null:(it.pbq.keep?(r.o||it.pbq.opts):shuffle(r.o||it.pbq.opts));});if(it.pbq&&it.pbq.type==="order")it.mix=shuffle(it.pbq.items.map(function(_,k){return k;}));});
    var ans={},flag={},i=0,end=Date.now()+mins*60000;
    function fmt(ms){var s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+("0"+s%60).slice(-2);}
    function answered(j){var a=ans[j],it=items[j];if(a==null)return false;if(!it.pbq)return true;return it.pbq.type==="order"?a.length===it.pbq.items.length:a.some(function(v){return v;});}
    function body(it){
      if(it.mc)return '<h3 style="font-size:1.15rem">'+esc(it.mc.q)+'</h3><div class="rm-opts">'+it.o.map(function(o,j){return '<button class="tile'+(ans[i]===j?" sel":"")+'" data-i="'+j+'">'+esc(o)+'</button>';}).join("")+'</div>';
      var q=it.pbq,h='<span class="kicker">Performance-based · '+esc(C.domains[q.d].name)+'</span><h3 style="font-size:1.15rem">'+esc(q.title)+'</h3><p style="margin:0">'+q.intro+'</p>';
      if(q.type==="order"){var got=ans[i]||[];return h+'<div class="rm-built">'+(got.length?got.map(function(k,m){return '<span class="chunk">'+(m+1)+'. '+esc(q.items[k])+'</span>';}).join("<br>"):'<span class="rm-ph">Tap the steps in order</span>')+'</div><div class="rm-opts pqord">'+it.mix.map(function(k){return '<button class="tile" data-k="'+k+'"'+(got.indexOf(k)>=0?" disabled":"")+'>'+esc(q.items[k])+'</button>';}).join("")+'</div><div class="row"><button class="btn ghost sm" id="pqclr"'+(got.length?"":" disabled")+'>Start over</button></div>';}
      var a=ans[i]||[];return h+'<div class="pq-rows">'+pbqRows(q).map(function(r,k){var id="xq"+k,v=a[k]||"";return '<div class="pq-row"><label for="'+id+'">'+esc(r.l)+'</label>'+(r.re?'<input class="fld" id="'+id+'" data-k="'+k+'" autocomplete="off" spellcheck="false" placeholder="'+esc(r.ph||"")+'" value="'+esc(v)+'">':'<select class="fld" id="'+id+'" data-k="'+k+'"><option value="">Choose…</option>'+it.ro[k].map(function(o){return '<option'+(o===v?" selected":"")+'>'+esc(o)+'</option>';}).join("")+'</select>')+'<span></span></div>';}).join("")+'</div>';}
    function draw(){var it=items[i];
      p.innerHTML='<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="kicker">'+(it.pbq?"PBQ ":"Question ")+(i+1)+' of '+total+(flag[i]?" · flagged":"")+'</span><span class="timer" id="ext" style="font-size:1.3rem">'+fmt(end-Date.now())+'</span></div>'+
       '<div class="sc">'+body(it)+'<div class="row"><button class="btn ghost sm" id="exprev"'+(i?"":" disabled")+'>← Back</button><button class="btn ghost sm" id="exflag">'+(flag[i]?"Unflag":"Flag")+'</button><button class="btn sm" id="exnext">'+(i<total-1?"Next →":"Review")+'</button></div></div>'+
       '<div class="exgrid">'+items.map(function(x,j){return '<button class="'+(j===i?"cur ":"")+(answered(j)?"done ":"")+(flag[j]?"flg":"")+'" data-j="'+j+'">'+(x.pbq?"P"+(j+1):(j+1))+'</button>';}).join("")+'</div><div class="row" style="margin-top:12px"><button class="btn" id="exsub">Finish and score</button></div>';
      if(it.mc)p.querySelector(".rm-opts").onclick=function(e){var b=e.target.closest(".tile");if(!b)return;ans[i]=+b.getAttribute("data-i");draw();};
      else if(it.pbq.type==="order"){p.querySelector(".pqord").onclick=function(e){var b=e.target.closest(".tile");if(!b||b.disabled)return;ans[i]=(ans[i]||[]).concat([+b.getAttribute("data-k")]);draw();};$("#pqclr").onclick=function(){ans[i]=[];draw();};}
      else [].forEach.call(p.querySelectorAll(".pq-rows .fld"),function(el){el.onchange=el.oninput=function(){ans[i]=ans[i]||[];ans[i][+el.getAttribute("data-k")]=el.value;var g=p.querySelector('[data-j="'+i+'"]');if(g)g.classList.toggle("done",answered(i));};});
      p.querySelector(".exgrid").onclick=function(e){var b=e.target.closest("[data-j]");if(b){i=+b.getAttribute("data-j");draw();}};
      $("#exprev").onclick=function(){i--;draw();};$("#exnext").onclick=function(){if(i<total-1){i++;draw();}else{var un=items.filter(function(_,j){return !answered(j);}).length;toast(un?un+" unanswered. Use the grid to jump back.":"All answered. Finish when ready.");}};
      $("#exflag").onclick=function(){flag[i]=!flag[i];draw();};$("#exsub").onclick=score;}
    function score(){clearTimers();var pts=0,max=0,per=C.domains.map(function(){return [0,0];}),missed=[],pbr=[];
      items.forEach(function(it,j){var a=ans[j];
        if(it.pbq){var f=pbqFrac(it.pbq,a);pts+=f*PBQW;max+=PBQW;pbr.push([it.pbq,f]);st.pbq=st.pbq||{};st.pbq[it.pbq.id]=Math.max(st.pbq[it.pbq.id]||0,f);return;}
        var q=it.mc,good=a!=null&&it.o[a]===q.a;max++;per[q.d][1]++;if(good){pts++;per[q.d][0]++;}else missed.push([q,a!=null?it.o[a]:"(no answer)"]);st.q[q.k]=good?1:0;});
      var pct=Math.round(100*pts/max);st.ex.push({s:pct,d:today()});save();
      p.innerHTML='<div class="sc"><span class="kicker">'+(pct>=85?"Ready":"Not yet")+'</span><h3>'+pct+'% · '+(Math.round(pts*10)/10)+' of '+max+' points</h3><div class="scroll"><table class="t"><tr><th>Section</th><th>Result</th></tr>'+
        pbr.map(function(x){return '<tr><td>PBQ: '+esc(x[0].title)+'</td><td>'+Math.round(x[1]*100)+'%</td></tr>';}).join("")+
        per.map(function(x,di){return '<tr><td>'+esc(C.domains[di].name)+'</td><td>'+x[0]+' / '+x[1]+'</td></tr>';}).join("")+'</table></div><div class="row"><button class="btn" id="exagain">Back to practice exams</button></div></div>'+
       (pbr.some(function(x){return x[1]<1;})?'<div class="lesson" style="margin-top:20px"><h3>PBQ answer keys</h3></div>'+pbr.filter(function(x){return x[1]<1;}).map(function(x){var q=x[0];return '<div class="sc" style="margin-bottom:10px"><b>'+esc(q.title)+'</b>'+(q.type==="order"?'<ol class="pq-key">'+q.items.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ol>':'<ul class="pq-key">'+pbqRows(q).map(function(r){return '<li>'+esc(r.l)+': <b>'+esc(r.show||[].concat(r.a)[0])+'</b></li>';}).join("")+'</ul>')+(q.explain?'<p style="margin:0;color:var(--mut)">'+esc(q.explain)+'</p>':'')+'</div>';}).join(""):"")+
       (missed.length?'<div class="lesson" style="margin-top:20px"><h3>Review what you missed</h3></div>'+missed.map(function(m){return '<div class="sc" style="margin-bottom:10px"><b>'+esc(m[0].q)+'</b><p style="margin:0">Your answer: '+esc(m[1])+'</p><p style="margin:0"><b>Correct:</b> '+esc(m[0].a)+'</p><p style="margin:0;color:var(--mut)">'+esc(m[0].e)+'</p></div>';}).join(""):"");
      $("#exagain").onclick=function(){certExam(p,C);};}
    timers.push(setInterval(function(){var t=$("#ext");if(t)t.textContent=fmt(end-Date.now());if(Date.now()>=end){toast("Time is up.");score();}},1000));
    draw();};}
function sheet(){app.innerHTML='<div class="lvh"><span class="kicker">Interview morning. Read once. Nothing new.</span><h1>The cheat sheet</h1><p class="lede">One line per topic. Face down on the desk during the call.</p></div><div class="scroll"><table class="t sheet"><tr><th>Topic</th><th>The one line</th></tr>'+SHEET.map(function(r){return "<tr><td>"+esc(r[0])+"</td><td>"+esc(r[1])+"</td></tr>";}).join("")+'</table></div>'+
  '<div class="lesson" style="margin-top:26px"><h3>During the call</h3><ul><li>Open with <q>Happy to dive in.</q></li><li>First sentence answers the question.</li><li>Same question twice: <q>The core of it is…</q></li><li>Don\'t know: the gap sentence, then reason out loud.</li><li>Never apologise. Three seconds to think is fine.</li><li>End with: <q>Thank you. I enjoyed this. What are the next steps?</q></li></ul><h3>After</h3><p>Within half an hour, write down every question they asked and what you said, while it\'s fresh.</p></div>';}

hud();route();acctStart();
})();
</script>
